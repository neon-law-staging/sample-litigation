<!doctype html>
<html lang="en">
  <head>
    <!--

      Source for this deployment: see the repository named in `package.json`.
      Deploy a modified version for other people to use over a network and
      AGPL section 13 obliges you to offer those users its corresponding source.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The mount contract, stated in the document Navigator publishes.

      The element carrying `id="sample-litigation-portal-ready"` is rendered by React,
      so it exists only once the app has actually mounted — which is the point
      of it. This tag names that hook in the built `index.html` so a check that
      reads the published document, rather than driving a browser, can still
      find the contract it is looking for.
    -->
    <meta name="navigator-ready-hook" content="sample-litigation-portal-ready" />
    <title>Cruller v. Prine — Client Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      A module script Vite rewrites to a hashed, same-origin asset under the
      build's base. Nothing here is inline: the portal serve CSP is
      `script-src 'self'`, and an inline script would simply be blocked.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
