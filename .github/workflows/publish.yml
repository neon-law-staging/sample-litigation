name: publish

# The bytes half. `ci` proves the bundle; this moves it.
#
# Navigator serves this portal by streaming objects out of a deployment's
# private applications bucket, under the flat prefix `<project>/portal/`.
# Neither the prefix nor the bucket is written down here. Both are derived from
# `navigator.yaml`: the prefix from `project`, and the bucket from `host`
# through the `DEPLOYMENTS` table in `.github/navigator.py`, whose rows mirror
# `deployments/<name>/config.toml` in `navigator-deploy`. This repository says
# `host: staging.neonlaw.com`, so it publishes to staging because it said
# staging, and a host nobody has provisioned fails this workflow rather than
# uploading a portal somewhere nothing serves.
#
# The two credential coordinates are repository *variables*, not secrets, and
# that is deliberate rather than sloppy — which matters here, because this
# repository is public. A Workload Identity provider resource name and a
# service-account email are public identifiers, and no service-account key
# exists. The trust is enforced on Google's side by three independent controls:
#
#   1. the provider's attribute condition, which requires the OIDC token to
#      carry `repository == neon-law-staging/sample-litigation` AND
#      `ref == refs/heads/main`;
#   2. the service account's `workloadIdentityUser` binding, which names that
#      one repository as the only principal that may impersonate it;
#   3. a bucket IAM condition confining the account's writes to the
#      `sample-litigation/portal/` prefix.
#
# So a fork may read these values, copy this file verbatim, and still publish
# nothing: its token carries a different `repository` claim. GitHub also refuses
# to issue `id-token: write` to a fork's pull-request run at all.
#
# ## Why there are two triggers and not one
#
# **Events triggered by `GITHUB_TOKEN` do not create workflow runs.** That is
# GitHub's recursion guard and it is not optional. `ci`'s auto-merge job squashes
# with a GitHub App token rather than `GITHUB_TOKEN` precisely so the resulting
# push to `main` is attributed to the App and does deliver a `push` event. If
# that ever regresses to `GITHUB_TOKEN`, merges will land on `main` and publish
# nothing, silently. `workflow_dispatch` is the manual way out of that:
#
#     gh workflow run publish.yml --ref main
#
# A publish is an overwrite and never a delete, so a redundant dispatch is safe:
# the worst it does is upload identical bytes and restamp them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never two publishes into one prefix. A superseded run has nothing left to
  # upload, but unlike `ci` it is not cancelled mid-flight: a cancelled publish
  # can leave an index.html naming assets from two builds.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token Workload Identity Federation exchanges.
      # No service-account key exists, so this is the whole of the credential.
      id-token: write

    # Skips cleanly on a fork, or before the publisher identity is provisioned,
    # rather than failing red. `publish` is not a required check — `ci` is — so a
    # skip blocks nothing. The two variables are set together:
    #
    #   gh variable set NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER --body '<provider>'
    #   gh variable set NAVIGATOR_APP_PUBLISHER_SERVICE_ACCOUNT --body '<sa email>'
    #
    # The bucket is deliberately absent from that list. It comes from
    # `navigator.yaml`, so an unprovisioned repository skips for want of a
    # credential rather than for want of a destination.
    if: vars.NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER != ''

    steps:
      - uses: actions/checkout@v7

      # The destination, derived and printed before anything is built. The
      # bucket is a function of `host`, so this step is where a publish to the
      # wrong deployment is caught — in the log, by name, above the upload.
      - id: navigator
        name: navigator.yaml
        run: |
          set -euo pipefail
          python3 .github/navigator.py --check
          {
              echo "bucket=$(python3 .github/navigator.py applications-bucket)"
              echo "prefix=$(python3 .github/navigator.py prefix)"
          } >> "${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # No registry configuration and no token, for the same reason as in `ci`:
      # the component library is a public release tarball URL.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The origin gate, over the exact bytes about to be uploaded. It runs here
      # as well as in `ci` because this is the last place an off-origin host can
      # be caught before the bundle is served.
      #
      # `conventions.py` — the layout gate the Project repositories under
      # `neon-law/` also run — is deliberately not here. It encodes the closed
      # root layout of a Project repository whose portal lives under `portal/`,
      # and this repository is a sample with its portal at the root, plus
      # `pleadings/`, `templates/`, and `scripts/`. Holding it to that layout
      # would take more exemptions than the check is worth. `navigator validate`
      # in `ci` covers the notation side, and `application-publish` re-derives
      # the mount and refuses a bundle built at any other base.
      - run: python3 .github/no-external-references.py

      # Two passes, hashed assets first and index.html last, deleting nothing:
      # the applications bucket is private and shared across every Project, so a
      # publish must never prune another Project's objects out of the flat
      # namespace. Rollback is a revert on `main`, republished.
      #
      # `dist_dir` is the one input this layout needs. The action defaults to
      # `portal/dist`; this repository's portal *is* the root, so it is `dist`.
      # `repository` is not passed: `application-publish` now reads the Project
      # code from this repository's own `navigator.yaml` first (`project:`),
      # falling back to the repository name only if that manifest were absent —
      # and the two already agree here.
      #
      # A reference that names an org the Firm no longer holds is a defect,
      # whether it is Actions or `curl` that dereferences it. One rule, two
      # failure modes — not a rule with an exception.
      #
      # A `uses:` fails loudly.
      # Actions does not resolve a `uses:` across an org rename — it reports
      # `Unable to resolve action. Repository not found`, which reads like a
      # deleted action rather than a moved one. The pre-rename handle was
      # `neon-law-foundation`, so any `uses:` still naming it is that bug
      # waiting.
      #
      # A download fails silently, and it is the half that executes.
      # **A redirect is a convenience, not a trust boundary.** GitHub serves a
      # rename redirect only while the old handle stays unregistered, and
      # whoever registers it next owns the tarball `ci` unpacks and runs. The
      # redirect resolving is what proves the old handle is unowned — the
      # exposure, not the reassurance. An identifier the Firm no longer holds
      # is not the Firm's, whatever still answers when it is dereferenced.
      #
      # A pinned digest is a second layer, not a substitute. `pnpm` checks the
      # `navigator-ux` tarball against `integrity:` in `pnpm-lock.yaml` and
      # fails closed; `ci` pipes `curl` into `tar` with nothing to check
      # against. A digest narrows what a taken handle can do — it does not make
      # one safe to keep naming.
      #
      # The ref is `26.8.23`, matching the Project repositories under
      # `neon-law/`. It cannot be read from a variable — `uses:` is resolved
      # before expressions are evaluated — so a bump is edited here by hand.
      - name: publish to ${{ steps.navigator.outputs.bucket }}/${{ steps.navigator.outputs.prefix }}
        uses: neon-law-source-code/navigator/.github/actions/application-publish@26.8.23
        with:
          applications_bucket: ${{ steps.navigator.outputs.bucket }}
          workload_identity_provider: ${{ vars.NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ vars.NAVIGATOR_APP_PUBLISHER_SERVICE_ACCOUNT }}
          dist_dir: dist
