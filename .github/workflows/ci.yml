name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Turn on GitHub auto-merge on open and on every push, so a green gate with
  # resolved review threads squash-merges without a manual "Merge when ready".
  # Idempotent, so re-running is a harmless no-op that also re-arms auto-merge if
  # a push cleared it. To hold a ready pull request, convert it to draft rather
  # than disabling auto-merge.
  enable-automerge:
    name: enable PR auto-merge
    # enablePullRequestAutoMerge requires contents:write; pull-requests:write
    # alone returns "Resource not accessible by integration". Only this job asks
    # for it, so the rest of the gate stays contents:read.
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The App ID is hoisted to job-level `env` so the step `if:` below can gate
    # on its presence: the `secrets` context is not available in `if:`, but
    # `env` is.
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
    steps:
      # Arm auto-merge as a GitHub App, and ONLY as a GitHub App.
      #
      # WHICH IDENTITY ARMS IT DECIDES WHETHER ANYTHING VALIDATES `main`.
      # GitHub's workflow-recursion guard creates no workflow runs for a push
      # attributed to `GITHUB_TOKEN`. Auto-merge merges as whoever armed it, so a
      # merge armed with the run's own token lands on `main` and starts nothing —
      # not a skipped run, not a red one: none. Nothing goes red, because nothing
      # runs.
      #
      # That is not hypothetical. `navigator` lost a release to it and one of the
      # private Project repositories lost a publish to it twice, leaving production
      # on a stale bundle until it was recovered by hand. That repository is not
      # named here — a Project code is a client identifier.
      #
      # So both steps are gated on the App being configured and there is NO
      # fallback to the workflow token. An absent secret arms nothing and leaves
      # the pull request visibly waiting for a human, which a lost run is not. A
      # secret that is present but broken fails the mint and arms nothing either.
      # Both are fail-closed on purpose, and `.github/automerge-identity.py` —
      # run by the `ci` job below — asserts the fallback stays absent. Forks,
      # which hold no secrets, skip both steps and still pass.
      #
      # The App is `neon-law-staging-merge-queue` (app id 4683165), owned by
      # `neon-law-staging` and installed on ALL its repositories, so a repository
      # created later needs no install step. It holds exactly `contents: write`
      # and `pull_requests: write` and deliberately no `workflows`. A pull
      # request touching `.github/workflows/**` therefore still cannot be armed
      # and is merged by hand — including the one that introduced this job.
      #
      # Dependabot has a SEPARATE secret store. Both secrets are mirrored there;
      # without that its bumps arm nothing.
      - name: mint app token
        id: app-token
        if: env.AUTOMERGE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: request auto-merge
        if: env.AUTOMERGE_APP_ID != ''
        env:
          # The App installation token, and nothing else.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # `gh` targets github.com unless told otherwise, and a token sent to
          # the wrong API host comes back "Bad credentials" (HTTP 401) rather
          # than a permissions error. Derive the API host from the run.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          auto_merge_enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "${auto_merge_enabled}" = "true" ]; then
              echo "auto-merge already enabled; nothing to do."
              exit 0
          fi
          pr_id="$(gh pr view "${PR_URL}" --json id --jq '.id')"
          # A pull request that edits any `.github/workflows/*` file cannot be
          # auto-merged by the App: it deliberately lacks the `workflows`
          # permission. That is expected and unfixable from CI, so treat only
          # that refusal as a soft pass; any other failure is real.
          if ! result="$(gh api graphql -f pr="${pr_id}" -f query='
              mutation($pr: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: SQUASH }) {
                  pullRequest { number }
                }
              }' 2>&1)"; then
              if printf '%s' "${result}" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
                  echo "PR edits workflow files; the App cannot enable auto-merge. Arm or merge it manually."
                  printf '%s\n' "${result}"
                  exit 0
              fi
              # Arming only *requests* the merge, so auto-merge needs a required
              # check to wait on. With no ruleset binding one, the mutation is
              # refused as "in unstable status" — a repository configuration gap,
              # not a fault in this pull request.
              if printf '%s' "${result}" | grep -q 'unstable status'; then
                  echo "No required status check is bound on this repository, so auto-merge has nothing to wait on."
                  echo "Bind the \`ci\` context in a branch ruleset to enable it. Merging manually until then."
                  printf '%s\n' "${result}"
                  exit 0
              fi
              printf '%s\n' "${result}" >&2
              exit 1
          fi
          printf '%s\n' "${result}"

  # Fast and dependency-light, so a style problem reports in seconds rather than
  # behind a full build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # `package.json` invokes the render script by path, so its mode is part of
      # the interface. An editor or a rewrite-through-a-temp-file drops the bit
      # silently, git records the mode change without comment, and nothing fails
      # until someone runs `pnpm render:documents`.
      - name: the render script is executable
        run: test -x scripts/render-documents.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # `--frozen-lockfile` is the point of committing the lockfile: the library
      # resolves from a release tarball rather than a registry range, and the
      # lockfile's sha512 is what pins which bytes that URL is allowed to serve.
      # An install that silently re-resolved would defeat it.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm build

      # After the build, never before. The bundle and license gates assert on
      # real output — that nothing reaches off-origin, and that the AGPL notice
      # survived into every emitted file — so running them first would pass by
      # finding nothing to check rather than by being correct.
      - run: pnpm test

      # `navigator.yaml`, parsed and checked before anything reads it. The host
      # must be a deployment Navigator actually serves and the Project code must
      # be a lowercase slug, because that string becomes a URL path segment and a
      # bucket prefix — both compared byte for byte. A typo here would otherwise
      # surface as a portal published under a prefix nothing serves.
      - run: python3 .github/navigator.py --check

      # The origin gate, over the same built bytes `publish` will upload. It runs
      # in both places on purpose: here it blocks the merge, and there it is the
      # last check before the bundle is served.
      - run: python3 .github/no-external-references.py

  # The gate over the Markdown and the YAML, which nothing in `pnpm check` reads.
  #
  # The CLI arrives as the Linux tarball from a public Navigator release: one static
  # binary, no tap, no registry account, and nothing for an Ubuntu runner to build.
  # It unpacks under `$HOME` rather than `/usr/local/bin` so the step needs no sudo.
  #
  # The version is pinned rather than floating on whatever released last, so a rule
  # added upstream arrives when this line is bumped instead of turning a green branch
  # red overnight. Bumping it is a normal pull request. Keep it in step with the
  # formula a developer installs locally:
  # `brew install neon-law-source-code/navigator/navigator`.
  notation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NAVIGATOR_VERSION: 26.8.22-hotfix.23
    steps:
      - uses: actions/checkout@v7

      - name: install the Navigator CLI
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          release="https://github.com/neon-law-source-code/navigator/releases/download/${NAVIGATOR_VERSION}"
          curl --fail --location --silent --show-error \
              "${release}/navigator-${NAVIGATOR_VERSION}-linux.tar.gz" \
              | tar -xz -C "${HOME}/.local/bin" navigator
          "${HOME}/.local/bin/navigator" --version
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # `validate` walks the tree itself — every Markdown, event, and YAML file
      # under the checkout — so there is no list here to fall out of date. It exits
      # non-zero on an error and zero on a warning, which is the split this job
      # wants: a warning is worth reading in the log, not worth blocking a merge.
      - run: navigator validate

  # The single required status check. It runs nothing itself: the jobs above do
  # the work and this one reports their combined result under one context name
  # that never has to move.
  #
  # A required status check is matched by string, so renaming a working job
  # renames its check run while the ruleset goes on waiting for the old
  # spelling. Nothing turns red; pull requests simply sit forever on a check
  # that will never arrive. The gate therefore terminates in a job spelled
  # exactly `ci`, leaving the jobs behind it free to be renamed.
  #
  # It tests each dependency's result explicitly rather than relying on a bare
  # `needs:`, because a skipped required check is not a red one: GitHub reports
  # no result at all, so the gate would quietly stop blocking exactly when the
  # jobs it guards had failed.
  ci:
    name: ci
    needs: [lint, verify, notation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The credential that arms auto-merge, asserted on every run. This is the
      # only check that can catch a silent loss: a merge armed under
      # `GITHUB_TOKEN` starts no workflow at all, so nothing downstream of it
      # ever goes red. It lives in the required check itself rather than in a
      # job behind it, so it cannot be dropped without editing `ci`.
      - name: auto-merge identity
        run: python3 .github/automerge-identity.py

      - name: report the gate result
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          NOTATION_RESULT: ${{ needs.notation.result }}
        run: |
          set -euo pipefail
          echo "lint: ${LINT_RESULT}"
          echo "verify: ${VERIFY_RESULT}"
          echo "notation: ${NOTATION_RESULT}"
          if [ "${LINT_RESULT}" != "success" ] || [ "${VERIFY_RESULT}" != "success" ] \
              || [ "${NOTATION_RESULT}" != "success" ]; then
              echo "::error::the merge gate is red"
              exit 1
          fi
