name: ci

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: neon-law-source-code/navigator/.github/workflows/project-gate.yml@26.9.19
    with:
      project: "sample-litigation"
      host: "staging.neonlaw.com"

  # A green gate arms GitHub auto-merge on its own, as the merge-queue App and
  # never as `GITHUB_TOKEN`. That distinction is load-bearing rather than
  # cosmetic: GitHub creates no workflow runs for a push attributed to
  # `GITHUB_TOKEN`, and auto-merge merges as whoever armed it, so a merge armed
  # with this run's own token would land on `main` and start nothing — not a
  # skipped run, not a red one: none.
  #
  # If the App secrets are absent the job arms nothing and the pull request
  # visibly waits for a human, which is the safe direction to fail. A draft
  # pull request is left alone, so converting one to draft holds it and a push
  # re-arms it.
  enable-automerge:
    needs: ci
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Look for the merge-queue App credentials
        id: credentials
        env:
          APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
              echo "present=true" >> "${GITHUB_OUTPUT}"
          else
              echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Mint a merge-queue App token
        id: app-token
        if: steps.credentials.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Arm auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
              echo "::notice::merge-queue App credentials absent — arming nothing, merge by hand"
              exit 0
          fi
          gh pr merge --squash --auto "${PR_URL}"
